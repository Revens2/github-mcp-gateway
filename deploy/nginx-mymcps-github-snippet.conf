# Fragment nginx pour le MCP GitHub — A INSERER dans le server 443 existant
# /etc/nginx/sites-available/mymcps.duckdns.org.conf (ne pas creer de nouveau vhost).
# Gateway : 127.0.0.1:8799. Rollback : supprimer les 7 blocs, nginx -t && reload.
# NOTE : ce fragment est documentaire. Le deploiement utilise
# deploy/ajouter-blocs-nginx.py (clone les blocs calendar, idempotent).
# Sauvegarde prealable obligatoire :
#   cp /etc/nginx/sites-available/mymcps.duckdns.org.conf \
#      /srv/archives/mymcps.duckdns.org.conf.$(date +%F)-pre-github && nginx -t

# 1. Protected Resource Metadata RFC 9728 (exact, sans slash final)
location = /.well-known/oauth-protected-resource/github/mcp {
    proxy_pass http://127.0.0.1:8799/.well-known/oauth-protected-resource/github/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# 2. Authorization Server Metadata RFC 8414 (exact)
location = /.well-known/oauth-authorization-server/oauth/github {
    proxy_pass http://127.0.0.1:8799/.well-known/oauth-authorization-server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# 3. Routes OAuth (authorize, token, register, revoke, consentement)
location ~ ^/oauth/github/(authorize|token|register|revoke|consentement) {
    rewrite ^/oauth/github(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8799;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# Pas de redirections legacy : service nouveau, aucun client historique.
# (Les services astra/tasks/calendar ont des rewrites de compatibilite ;
#  github n'en a pas besoin.)

# 4. Anti-trailing-slash + MCP (timeouts longs 3600s, buffering off)
location = /github/mcp/ { return 404; }
location ~ ^/github/mcp/ { return 404; }
location = /github/mcp {
    rewrite ^/github(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8799;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Accept $http_accept;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 2m;
}
